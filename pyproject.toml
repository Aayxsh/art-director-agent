[project]
name = "art-director-agent"
version = "0.1.0"
description = "A closed-loop image generation agent: MCP-orchestrated diffusers pipeline with self-critique."
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.31",
    "transformers",
    "accelerate",
    "torch",
    "mcp",
    "pillow",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["mcp_server*", "pipeline*", "eval*", "demo*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["pipeline", "mcp_server", "eval"]
markers = [
    "gpu: tests that require a CUDA GPU (skipped in CI)",
]
